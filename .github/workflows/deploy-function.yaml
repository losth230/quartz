# ═══════════════════════════════════════════════════════════════════════════
#  DÉPLOIEMENT AUTOMATIQUE — Edge Function « resoudre-tour » (Supabase)
#  À chaque push qui touche le moteur (src/engine, src/rules) ou la
#  fonction elle-même :
#    1. bundle esbuild (_engine.mjs — JSON inliné, extensions résolues) ;
#    2. TEST D'EXÉCUTION du bundle (runTurn + intégration) — un bundle
#       cassé n'est JAMAIS déployé ;
#    3. déploiement via la CLI Supabase.
#  Le token vit dans les GitHub Secrets (SUPABASE_ACCESS_TOKEN) — jamais
#  dans le code. Tant que le secret n'existe pas, ce workflow échoue à
#  l'étape deploy sans rien casser d'autre.
# ═══════════════════════════════════════════════════════════════════════════
name: Deploy Edge Function resoudre-tour

on:
  push:
    branches: [v4]
    paths:
      - 'jeu/src/engine/**'
      - 'jeu/src/rules/**'
      - 'jeu/src/config/**'
      - 'jeu/supabase/functions/resoudre-tour/**'
      - 'jeu/scripts/build-function.mjs'
      - 'jeu/scripts/test-function.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jeu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Bundle du moteur (esbuild)
        run: npm run build:function
      - name: Typecheck Edge Function (tsc + stubs)
        # un handler avec un identifiant non défini ne part JAMAIS en
        #   prod (bug 2026-10-19 : cfgMondiale — ReferenceError à
        #   chaque résolution serveur, déployé vert par tous les
        #   tests). Vérifié en régression locale sur le bug historique.
        run: npx tsc -p supabase/functions/resoudre-tour/tsconfig.check.json
      - name: Test d'exécution du bundle (refuse de déployer un bundle cassé)
        run: npm run test:function
      - name: Deploy Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest
      # (--yes, 2026-11-02 : la CLI (latest) demande une confirmation interactive
      #  en CI depuis le 02/11 — "Re-run with --yes to confirm". Elle deployait
      #  encore sans confirmation hier (v plus ancienne) ; --yes la rend
      #  non-interactive de façon stable.)
      - run: supabase functions deploy resoudre-tour --project-ref kucgmmefluwmlobujanc --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
