# ══════════════════════════════════════════════════════════════════════
#  Déploiement combiné : site quartz (v4) + jeu Chasse & Pêche
#  (branche chasse-et-peche-web) vers GitHub Pages.
#  Le site est servi à la racine, le jeu sous /jeu/ — sans écrasement.
#
#  NOTE : si l'environnement « github-pages » restreint les branches de
#  déploiement, seuls les runs issus de v4 déploient ; les runs issus
#  de la branche du jeu échouent à l'étape deploy (sans conséquence —
#  le prochain push sur v4 republie site + jeu ensemble).
#  ATTENTION : le groupe de concurrence « pages » n'accepte qu'une run
#  en attente — un nouveau push annule les runs en attente. Toujours
#  terminer par un push sur v4 pour réellement publier.
#
#  2026-10-10 (c) : traits génétiques 7.19 (traits_genetiques) — table parties_chasse_peche
#  (propre au jeu — la table parties du même projet est celle du wargame).
#  2026-10-11 (a) : page Royaume (rang, personnages importants, technologies, vassaux).
#  2026-10-11 (b) : page Royaume — correctif build (échappement params.ts) ; déploiement réel.
#  2026-10-11 (c) : refactor SOLID du moteur — engine.ts scindé en modules de domaine (façade à API inchangée) ; redéploiement.
#  2026-10-11 (d) : fix crash armées/villes + bâtiments automatiques par tour + récap ressources cumulé ; redéploiement.
#  2026-10-11 (e) : page Pays — dynastie mise en avant, production / tour calculée cumulée, ressources dépliables, aménagements de terrain et coûts déduits automatiquement ; redéploiement.
#  2026-10-12 (f) : page Pays — aménagements au-dessus des bâtiments + catégorie « Autres », référentiel exact (coût / production / description du classeur), cultures détaillées par ville, taxes sur toutes les ressources, panneau Ressources docké à droite, retrait dynastie ; redéploiement.
#  2026-10-12 (g) : page Royaume — cadre Joueur déplacé de la page Pays, technologies retirées (consultables dans Référentiels → Progrès), cultures & régimes paramétrables (référentiel + paramètres) avec lois chiffrées appliquées automatiquement à chaque tour, garnison des habitations affichée sous la culture (pays & villes) ; redéploiement.
#  2026-10-12 (h) : habitations — types Ville/Château (consommation par tour + garnison de base débitées automatiquement, référentiel éditable « Habitations »), garnison & Tourisme valeurs d'état (tourisme crédité une fois à la construction), page Royaume (culture expliquée, événement de dynastie, vassalité remontée) ; redéploiement.
#  2026-10-12 (i) : page Royaume — garnison des habitations retirée de l'encadré culture (donnée militaire déjà détaillée sur la page Joueur) ; redéploiement.
#  2026-10-12 (j) : page Pays — encadré « Culture du pays — bonus automatiques » : règle de pays chiffrée détaillée et appliquée à chaque fin de tour (ex. Lunisme : +4 Tourisme × nombre de villes lunistes dans le monde, dont chez soi — canal « Régimes & cultures » du récap ressources), +N Science par construction rappelé ; redéploiement.
#  2026-10-12 (k) : page Pays — production de chaque ville en bas de son cadre (tous canaux, total / tour) et cadre « Récap des ressources par tour — origine de chaque apport » (tableau canal par canal + provenance de chaque apport, calculés pour le prochain tour) ; redéploiement.
# ══════════════════════════════════════════════════════════════════════
name: Deploy Quartz site + Chasse & Pêche (jeu) to GitHub Pages

on:
  push:
    branches:
      - v4
      - chasse-et-peche-web
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (v4 — site quartz complet)
        uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies (quartz)
        run: npm ci
      - name: Build Quartz site
        run: npx quartz build
      - name: Checkout jeu (branche chasse-et-peche-web)
        uses: actions/checkout@v4
        with:
          ref: chasse-et-peche-web
          path: jeu
      - name: Install dependencies (jeu)
        run: npm install --no-audit --no-fund
        working-directory: jeu
      - name: Build jeu (vite)
        run: npm run build
        working-directory: jeu
      - name: Copier le jeu dans public/jeu/
        run: cp -r jeu/dist/. public/jeu/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
