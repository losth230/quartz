# ══════════════════════════════════════════════════════════════════════
#  DÉPLOIEMENT — site Quartz + jeu Chasse & Pêche vers GitHub Pages
#
#  UNIFICATION 2026-11-02 (option A) : le jeu vit désormais dans jeu/
#  sur CETTE branche (v4) — un SEUL checkout, plus de double branche
#  miroir chasse-et-peche-web. Le build du jeu se fait dans jeu/
#  (package.json/tsconfig dédiés, indépendants de la racine Quartz).
#
#  ⚠ Le groupe de concurrence « pages » n'accepte qu'une run en attente —
#  un nouveau push annule les runs en attente.
#
#  Historique du flux double-branche (supprimé) : jusqu'au 2026-11-02, le
#  workflow check-outait chasse-et-peche-web pour le jeu ; les évolutions
#  étaient maintenues en miroir sur les deux branches (commits jumeaux,
#  cf. docs/ia/journal-technique.md). Le miroir est abandonné : v4 est la
#  source unique de vérité (site + jeu).
# ══════════════════════════════════════════════════════════════════════
name: Deploy Quartz site + Chasse & Pêche (jeu) to GitHub Pages

on:
  push:
    branches:
      - v4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (v4 — site quartz + jeu)
        uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies (quartz)
        run: npm ci
      - name: Build Quartz site
        run: npx quartz build
      - name: Install dependencies (jeu)
        run: npm ci --no-audit --no-fund
        working-directory: jeu
      - name: Build jeu (tsc + vite)
        run: npm run build
        working-directory: jeu
      - name: Copier le jeu dans public/jeu/
        run: cp -r jeu/dist/. public/jeu/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
