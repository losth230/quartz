name: Deploy Quartz site + Chasse & Pêche (jeu) to GitHub Pages

on:
  push:
    branches:
      - v4
      - chasse-et-peche-web
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 0

      - name: Récupérer le jeu (branche chasse-et-peche-web)
        uses: actions/checkout@v4
        with:
          ref: chasse-et-peche-web
          path: jeu

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Build Chasse & Pêche (jeu)
        run: |
          cd jeu
          npm install --no-audit --no-fund
          npm run build

      - name: Intégrer le jeu sous /jeu/
        run: |
          mkdir -p public/jeu
          cp -r jeu/dist/. public/jeu/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
