# ══════════════════════════════════════════════════════════════════════
name: Deploy Quartz site + Chasse & Pêche (jeu) to GitHub Pages

on:
  push:
    branches:
      - v4
      - chasse-et-peche-web
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (v4 — site quartz complet)
        uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies (quartz)
        run: npm ci
      - name: Build Quartz site
        run: npx quartz build
      - name: Checkout jeu (branche chasse-et-peche-web)
        uses: actions/checkout@v4
        with:
          ref: chasse-et-peche-web
          path: jeu
      - name: Install dependencies (jeu)
        run: npm install --no-audit --no-fund
        working-directory: jeu
      - name: Build jeu (vite)
        run: npm run build
        working-directory: jeu
      - name: Copier le jeu dans public/jeu/
        run: cp -r jeu/dist/. public/jeu/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
