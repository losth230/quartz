# ══════════════════════════════════════════════════════════════════════
#  CI JEU — Chasse & Pêche (dossier jeu/, branche v4)
#  Typecheck strict + tests moteur/fusion/banque + bundle Edge Function
#  + test d'exécution du bundle (celui que Deno chargera) + build vite.
#
#  UNIFICATION 2026-11-02 (option A) : le jeu vit désormais dans jeu/ sur
#  la branche v4 (plus de double branche miroir chasse-et-peche-web).
#  Le dossier jeu/ porte son PROPRE package.json/tsconfig (React) —
#  indépendant de la racine du site Quartz (preact) : le typecheck du jeu
#  se fait dans jeu/, plus aucun faux positif « Cannot find module react ».
# ══════════════════════════════════════════════════════════════════════
name: CI jeu

on:
  push:
    branches: [v4]
    paths:
      - 'jeu/**'
  pull_request:
    paths:
      - 'jeu/**'
  workflow_dispatch:

jobs:
  jeu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jeu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jeu/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck strict
        run: npx tsc --noEmit
      - name: Tests (moteur, fusion multijoueur, banque d'effets)
        run: npm test
      - name: Bundle Edge Function (esbuild — résout extensions + JSON)
        run: npm run build:function
      - name: Typecheck Edge Function (tsc + stubs)
        run: npx tsc -p supabase/functions/resoudre-tour/tsconfig.check.json
      - name: Test d'exécution du bundle (comme Deno le chargera)
        run: npm run test:function
      - name: Build du jeu (tsc + vite)
        run: npm run build
