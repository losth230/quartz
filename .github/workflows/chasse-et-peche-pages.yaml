# ── Déploiement automatique du jeu Chasse & Pêche sur GitHub Pages ──────
# À chaque push sur main : build Vite → publication sur
# https://losth230.github.io/Chasse-et-Peche/
# Le workflow active lui-même GitHub Pages (build via Actions) si ce
# n'est pas déjà fait — personne n'a rien à configurer à la main.

name: Deploy Chasse & Peche (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "cpe-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification de types (informative, non bloquante)
        continue-on-error: true
        run: npm run typecheck

      - name: Build de production (vite)
        run: npm run build

      - name: Activer GitHub Pages (build via Actions) si nécessaire
        run: |
          code=$(curl -s -o /tmp/pages.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          echo "POST /pages → HTTP $code"
          cat /tmp/pages.json || true
          if [ "$code" = "409" ]; then
            curl -s -X PATCH \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d '{"build_type":"workflow"}' || true
          elif [ "$code" != "201" ]; then
            echo "⚠ Activation Pages non confirmée (HTTP $code) — le déploiement échouera si Pages n'est pas activé."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
